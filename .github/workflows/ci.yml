# Runs dependency-sensitive RHDL host, example, CIRCT, and FESVR checks.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

env:
  RACKET_VERSION: "9.2"
  # Update this pin deliberately when advancing the Rhombus dependency.
  RHOMBUS_CHECKSUM: 17d043235da8abc8d677c63b65034032dbb60b42

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Classify changes
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      host: "${{ steps.filter.outputs.host }}"
      host_matrix: "${{ steps.filter.outputs.host_matrix }}"
      circt: "${{ steps.filter.outputs.circt }}"
      circt_matrix: "${{ steps.filter.outputs.circt_matrix }}"
      fesvr: "${{ steps.filter.outputs.fesvr }}"
      examples: "${{ steps.filter.outputs.examples }}"
      example_matrix: "${{ steps.filter.outputs.example_matrix }}"
    steps:
      - name: Check out RHDL history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - name: Test change classifier
        run: tools/check-ci-changes.sh
      - name: Select affected jobs
        id: filter
        run: |
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            tools/ci-changes.sh --all >> "$GITHUB_OUTPUT"
          elif [[ "$GITHUB_EVENT_NAME" == pull_request ]]; then
            tools/ci-changes.sh \
              "${{ github.event.pull_request.base.sha }}" \
              "${{ github.event.pull_request.head.sha }}" \
              >> "$GITHUB_OUTPUT"
          else
            tools/ci-changes.sh \
              "${{ github.event.before }}" \
              "${{ github.sha }}" \
              >> "$GITHUB_OUTPUT"
          fi

  host:
    name: Host (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.host == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.host_matrix) }}
    steps:
      - name: Check out RHDL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: "${{ env.RACKET_VERSION }}"
      - name: Prepare cached Racket dependencies
        uses: ./.github/actions/setup-racket-cache
        with:
          racket-version: "${{ env.RACKET_VERSION }}"
          rhombus-checksum: "${{ env.RHOMBUS_CHECKSUM }}"
      - name: Run affected host test group
        run: make "${{ matrix.target }}"

  examples:
    name: Examples (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.examples == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.example_matrix) }}
    steps:
      - name: Check out RHDL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: "${{ env.RACKET_VERSION }}"
      - name: Prepare cached Racket dependencies
        uses: ./.github/actions/setup-racket-cache
        with:
          racket-version: "${{ env.RACKET_VERSION }}"
          rhombus-checksum: "${{ env.RHOMBUS_CHECKSUM }}"
      - name: Run affected example group
        run: make "${{ matrix.target }}"

  circt:
    name: CIRCT (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.circt == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.circt_matrix) }}
    steps:
      - name: Check out RHDL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: "${{ env.RACKET_VERSION }}"
      - name: Prepare cached Racket dependencies
        uses: ./.github/actions/setup-racket-cache
        with:
          racket-version: "${{ env.RACKET_VERSION }}"
          rhombus-checksum: "${{ env.RHOMBUS_CHECKSUM }}"
      - name: Install Verilator
        run: |
          sudo apt-get update
          sudo apt-get install --yes verilator
      - name: Cache CIRCT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/firtool-*
          key: "${{ runner.os }}-${{ runner.arch }}-circt-${{ hashFiles('tools/install-circt.sh') }}"
      - name: Install CIRCT
        run: make setup-circt
      - name: Verify affected CIRCT fixture group
        run: make "${{ matrix.target }}"

  fesvr:
    name: FESVR integration
    needs: changes
    if: needs.changes.outputs.fesvr == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out RHDL
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install Racket
        uses: Bogdanp/setup-racket@2466913449df77df2bad149d1f2fc4e1ea4795dd # v1.15
        with:
          architecture: x64
          distribution: full
          variant: CS
          version: "${{ env.RACKET_VERSION }}"
      - name: Prepare cached Racket dependencies
        uses: ./.github/actions/setup-racket-cache
        with:
          racket-version: "${{ env.RACKET_VERSION }}"
          rhombus-checksum: "${{ env.RHOMBUS_CHECKSUM }}"
      - name: Install native toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            device-tree-compiler \
            gcc-riscv64-unknown-elf \
            verilator \
            zlib1g-dev
      - name: Cache FESVR
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/fesvr-*
          key: "${{ runner.os }}-${{ runner.arch }}-fesvr-${{ hashFiles('tools/install-fesvr.sh', 'sim/fesvr/Makefile') }}"
      - name: Build pinned FESVR
        run: make -C sim/fesvr setup
      - name: Cache CIRCT
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/firtool-*
          key: "${{ runner.os }}-${{ runner.arch }}-circt-${{ hashFiles('tools/install-circt.sh') }}"
      - name: Install CIRCT
        run: make setup-circt
      - name: Test direct-memory transport
        run: make -C sim/fesvr test
      - name: Compile Verilator DPI adapter
        run: |
          verilator_root="$(verilator -V | sed -n 's/^ *VERILATOR_ROOT *= *//p' | head -1)"
          test -n "$verilator_root"
          make -C sim/fesvr dpi-compile-check VERILATOR_ROOT="$verilator_root"
      - name: Elaborate the FESVR RTL adapter
        run: make -C sim/fesvr rtl-elaboration-test
      - name: Simulate the native CHI-backed FESVR host
        run: make -C sim/fesvr chi-host-test
